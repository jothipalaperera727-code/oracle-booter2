name: Oracle Ampere 24/7 Provisioner

on:
  workflow_dispatch:

concurrency:
  group: oracle-provisioner
  cancel-in-progress: false

jobs:
  run-provisioner:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # Safety timeout (5.5 hours)

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Oracle OCI CLI Installer
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH
          echo "/home/runner/bin/x86_64" >> $GITHUB_PATH

      - name: Authenticate OCI Security Settings
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=ap-singapore-1" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_API_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> ~/.oci/config

          echo "${{ secrets.OCI_API_PRIVATE_KEY }}" > ~/.oci/config.bak
          tr -d '\r' < ~/.oci/config.bak > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Fire Persistent Server Construction Requests
        env:
          RAW_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          RAW_SUBNET: ${{ secrets.OCI_SUBNET_OCID }}
          RAW_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: True
          SUPPRESS_LABEL_WARNING: True
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          COMPARTMENT_ID=$(echo "$RAW_COMPARTMENT" | tr -d '\r\n' | xargs)
          SUBNET_ID=$(echo "$RAW_SUBNET" | tr -d '\r\n' | xargs)

          if [ -z "$COMPARTMENT_ID" ] || [ -z "$SUBNET_ID" ]; then
            echo "❌ Error: OCI_COMPARTMENT_OCID or OCI_SUBNET_OCID secret is empty or missing."
            exit 1
          fi

          echo "$RAW_SSH_KEY" | tr -d '\r' | grep -v '^$' | head -n 1 > ssh_key.pub
          OCI_BIN=$(which oci || echo "/home/runner/bin/oci")

          AD_NAME=$($OCI_BIN iam availability-domain list --compartment-id "$COMPARTMENT_ID" --query "data[0].name" --raw-output 2>/dev/null)
          if [ -z "$AD_NAME" ]; then
            AD_NAME="TVBP:AP-SINGAPORE-1-AD-1"
          fi
          echo "Target Availability Domain: $AD_NAME"

          IMAGE_ID=$($OCI_BIN compute image list --compartment-id "$COMPARTMENT_ID" --operating-system "Canonical Ubuntu" --shape "VM.Standard.A1.Flex" --query "data[0].id" --raw-output 2>/dev/null)
          if [ -z "$IMAGE_ID" ]; then
            IMAGE_ID="ocid1.image.oc1.ap-singapore-1.aaaaaaaaju37vsnun5gtybevsld236w23bglstn2vlyon7g7u26ioww6veqa"
          fi
          echo "Target Image OCID: $IMAGE_ID"

          # 25 outer loops x 3 Fault Domains = 75 total attempts (~2.8 hours total runtime)
          for i in {1..75}
          do
              echo "Firing Request Loop #$i using path: $OCI_BIN"

              RESPONSE=$($OCI_BIN compute instance launch \
                --availability-domain "$AD_NAME" \
                --compartment-id "$COMPARTMENT_ID" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus":2.0,"memoryInGBs":12.0}' \
                --boot-volume-size-in-gbs 150 \
                --display-name "GitHub-Ampere-Node" \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --ssh-authorized-keys-file ssh_key.pub \
                2>&1) || {
                echo "❌ Request failed:"
                echo "$RESPONSE"
                echo "Waiting 120 seconds to avoid HTTP 429 rate limits..."
                sleep 120
                continue
              }

              if [[ "$RESPONSE" == *"id"* ]]; then
                echo "🎉 SUCCESS! Your Ampere Server has been provisioned!"
                exit 0
              fi

              sleep 120
          done

          echo "🔄 Max attempts reached. Self-triggering the next workflow run immediately..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $PAT_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop_boot.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}")

          echo "API Response:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" != *"HTTP_STATUS:204"* ]]; then
            echo "❌ Dispatch failed! Review the HTTP status code above."
            exit 1
          fi
